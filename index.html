<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HallWala - Welcome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
    
    h1 { color: #1e293b; margin-bottom: 10px; font-size: 28px; }
    p { color: #64748b; margin-bottom: 30px; }

    /* Role Selection Screen */
    #roleSelection { display: flex; gap: 20px; justify-content: center; }
    .role-card { flex: 1; background: #f8fafc; border: 2px solid #e2e8f0; padding: 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .role-card:hover { border-color: #2563eb; background: #eff6ff; }
    .role-card h3 { color: #1e293b; margin-top: 10px; }
    .role-icon { font-size: 40px; }

    /* Login / OTP Screen */
    #loginScreen { display: none; }
    input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; text-align: center; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { background: #1d4ed8; }
    .back-btn { background: #94a3b8; margin-top: 10px; }
    
    #otpSection { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome to HallWala</h1>
    <p id="sub-title">Please choose your role to continue</p>

    <!-- STEP 1: Role Selection -->
    <div id="roleSelection">
      <div class="role-card" onclick="selectRole('Customer')">
        <div class="role-icon">🤵</div>
        <h3>Customer</h3>
      </div>
      <div class="role-card" onclick="selectRole('Hall Owner')">
        <div class="role-icon">🏢</div>
        <h3>Hall Owner</h3>
      </div>
    </div>

    <!-- STEP 2: Mobile Number & OTP Login -->
    <div id="loginScreen">
      <h2 id="selectedRoleText" style="color: #2563eb; margin-bottom: 20px;"></h2>
      
      <div id="phoneSection">
        <input type="number" id="mobileNumber" placeholder="Enter 10-digit Mobile Number">
        <button onclick="sendOTP()">Get OTP</button>
      </div>

      <div id="otpSection">
        <p style="color: #22c55e; font-weight: bold;">OTP sent successfully! (Demo: 1234)</p>
        <input type="number" id="otpInput" placeholder="Enter 4-digit OTP">
        <button onclick="verifyOTP()">Verify & Login</button>
      </div>

      <button class="back-btn" onclick="goBack()">🔙 Go Back</button>
    </div>
  </div>

  <script>
    let currentRole = "";
    let userLocation = "Unknown Location";

    // Jab user website kholta hai, hum uski location fetch kar lete hain
    fetch('https://ipapi.co/json/')
      .then(response => response.json())
      .then(data => {
        userLocation = data.city + ", " + data.region + " (" + data.country_name + ")";
      }).catch(err => console.log("Location fetch failed"));

    function selectRole(role) {
      currentRole = role;
      document.getElementById('roleSelection').style.display = 'none';
      document.getElementById('sub-title').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('selectedRoleText').innerText = role + " Login";
    }

    function goBack() {
      document.getElementById('roleSelection').style.display = 'flex';
      document.getElementById('sub-title').style.display = 'block';
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('otpSection').style.display = 'none';
      document.getElementById('phoneSection').style.display = 'block';
      document.getElementById('mobileNumber').value = "";
      document.getElementById('otpInput').value = "";
    }

    function sendOTP() {
      let phone = document.getElementById('mobileNumber').value;
      if(phone.length === 10) {
        document.getElementById('phoneSection').style.display = 'none';
        document.getElementById('otpSection').style.display = 'block';
        alert("Demo OTP '1234' sent to " + phone);
      } else {
        alert("Please enter a valid 10-digit mobile number.");
      }
    }

    function verifyOTP() {
      let otp = document.getElementById('otpInput').value;
      let phone = document.getElementById('mobileNumber').value;

      if(otp === "1234") {
        // Yahan hum aage chalkar data aapki Google Sheet (God Admin) mein bhejenge
        alert("Login Successful!\nRole: " + currentRole + "\nNumber: " + phone + "\nLocation: " + userLocation);
        
        // Login ke baad Dashboard par bhejenge
        if(currentRole === "Customer") {
          window.location.href = "customer-dashboard.html"; // Ye file hum aage banayenge
        } else {
          window.location.href = "owner-dashboard.html"; // Ye file hum aage banayenge
        }
      } else {
        alert("Invalid OTP! (Please use 1234 for demo)");
      }
    }
  </script>

</body>
</html>
