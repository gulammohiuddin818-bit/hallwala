<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HallWala - Book Banquet Halls</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; color: #333; }
    
    header { background: #1e293b; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 22px; }
    .login-btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    
    .container { padding: 20px; max-width: 1200px; margin: auto; }
    h2 { margin-bottom: 15px; color: #1e293b; }
    
    .hall-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .hall-card img { width: 100%; height: 200px; object-fit: cover; }
    .hall-info { padding: 15px; }
    .hall-info h3 { margin-bottom: 5px; color: #1e293b; }
    .hall-info p { color: #64748b; font-size: 14px; margin-bottom: 10px; }
    .price { font-weight: bold; color: #dc2626; margin-bottom: 10px; }
    .make-offer-btn { background: #ef4444; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; }

    /* Modal Styles */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; position: relative; }
    .modal-content h3 { margin-bottom: 15px; }
    .modal-content input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 4px; }
    .modal-content button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .close-btn { background: #64748b !important; margin-top: 8px; }

    /* Admin Dashboard */
    #adminDashboard { display: none; margin-top: 30px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .stats-box { display: flex; gap: 15px; margin-bottom: 20px; }
    .stat-card { flex: 1; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; text-align: center; }
    .stat-card h4 { color: #64748b; font-size: 14px; }
    .stat-card p { font-size: 20px; font-weight: bold; color: #1e293b; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: center; font-size: 14px; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>

  <header>
    <h1>HallWala</h1>
    <button class="login-btn" onclick="openLoginModal()">Login</button>
  </header>

  <div class="container">
    <h2>Available Halls & Marriage Lawns</h2>
    <div id="hallsList">
      <div class="hall-card">
        <img src="https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=600&q=80" alt="Hall">
        <div class="hall-info">
          <h3>Royal Garden Marriage Lawn</h3>
          <p>📍 Islampur, Bokaro</p>
          <div class="price">₹45,000 / Day</div>
          <button class="make-offer-btn" onclick="alert('Booking feature active hai!')">Make Offer</button>
        </div>
      </div>
    </div>

    <!-- Admin Dashboard Section -->
    <div id="adminDashboard">
      <h2 style="color: #2563eb; margin-bottom: 15px;">Admin Dashboard</h2>
      <div class="stats-box">
        <div class="stat-card">
          <h4>Total Bookings</h4>
          <p>0</p>
        </div>
        <div class="stat-card">
          <h4>Pending</h4>
          <p>0</p>
        </div>
      </div>
      <h3>All Requests</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Hall</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="bookingTableBody">
          <tr>
            <td colspan="7" style="color: #64748b;">Koi booking nahi mili.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h3>Secure Login</h3>
      <input type="text" id="loginPhone" placeholder="Mobile Number">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="handleLogin()">Login</button>
      <button class="close-btn" onclick="closeLoginModal()">Cancel</button>
    </div>
  </div>

  <script>
    function openLoginModal() {
      document.getElementById('loginModal').style.display = 'flex';
    }

    function closeLoginModal() {
      document.getElementById('loginModal').style.display = 'none';
    }

    function handleLogin() {
      let phone = document.getElementById('loginPhone').value.trim();
      let password = document.getElementById('loginPassword').value.trim();

      if(phone === "6204984288" && password === "18April@2024") {
        alert("Welcome Gulam Mohiuddin! You are logged in as: Admin");
        closeLoginModal();
        document.getElementById('adminDashboard').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      } else {
        alert("Invalid Number or Password");
      }
    }
  </script>

</body>
</html>
