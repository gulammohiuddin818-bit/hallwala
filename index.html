<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HallWala - Bharat Ka Apna Hall Booking Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --accent: #f43f5e;
      --bg: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #1e293b;
      --muted: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-header h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #4f46e5, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .brand-header p {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      margin-top: 4px;
    }

    /* Role Selector */
    .role-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #f1f5f9;
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 20px;
    }
    .role-btn {
      border: none;
      background: transparent;
      padding: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .role-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
    }

    /* Tabs (Login vs Register) */
    .tab-container {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: none;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      position: relative;
    }
    .tab-btn.active {
      color: var(--primary);
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      background: #f8fafc;
      transition: all 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .otp-inline {
      display: flex;
      gap: 8px;
    }
    .btn-small {
      padding: 10px 14px;
      background: #e0e7ff;
      color: var(--primary);
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-small:hover { background: #c7d2fe; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px -5px rgba(79, 70, 229, 0.5);
    }
    .btn-primary:active { transform: translateY(0); }

    .badge-verified {
      display: none;
      align-items: center;
      gap: 4px;
      color: #16a34a;
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
    }

    .biometric-box {
      margin-top: 16px;
      text-align: center;
      padding-top: 16px;
      border-top: 1px dashed #cbd5e1;
    }
    .biometric-btn {
      background: none;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .biometric-btn:hover { border-color: var(--primary); color: var(--primary); }

    .helper-text {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <!-- Brand Header -->
    <div class="brand-header">
      <h1>HallWala</h1>
      <p id="portalSubtitle">Customer Experience Portal</p>
    </div>

    <!-- 1. Role Selector (Customer vs Hall Owner) -->
    <div class="role-container">
      <button class="role-btn active" id="btnRoleCustomer" onclick="setRole('Customer')">
        🤵 Customer
      </button>
      <button class="role-btn" id="btnRoleOwner" onclick="setRole('Hall Owner')">
        🏢 Hall Owner
      </button>
    </div>

    <!-- 2. Action Tabs (Login vs Register) -->
    <div class="tab-container">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Naya Account</button>
    </div>

    <!-- ================= LOGIN FORM ================= -->
    <div id="loginFormSection">
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="loginMobile" class="input-field" placeholder="10-digit mobile number" maxlength="10">
      </div>
      <div class="form-group">
        <label>Password ya Security PIN</label>
        <input type="password" id="loginPassword" class="input-field" placeholder="Apna password dalein">
      </div>
      <button class="btn-primary" onclick="handleLogin()">Login Karein 🚀</button>

      <div class="biometric-box">
        <button class="biometric-btn" onclick="handleBiometric()">
          🔐 Fingerprint / Face ID Login
        </button>
      </div>
    </div>

    <!-- ================= REGISTRATION FORM ================= -->
    <div id="registerFormSection" style="display: none;">
      <div class="form-group">
        <label>Poora Naam (Full Name)</label>
        <input type="text" id="regName" class="input-field" placeholder="Jaise: Rahul Kumar">
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Janam Tithi (DOB)</label>
          <input type="date" id="regDob" class="input-field">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="regGender" class="input-field">
            <option value="">Chuniye</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Transgender">Transgender</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Mobile Number (OTP Verify Hoga)</label>
        <div class="otp-inline">
          <input type="tel" id="regMobile" class="input-field" placeholder="10-digit number" maxlength="10">
          <button class="btn-small" id="btnSendMobileOtp" onclick="sendMobileOTP()">Send OTP</button>
        </div>
        <div id="mobileOtpBox" style="display: none; margin-top: 8px;" class="otp-inline">
          <input type="number" id="regMobileOtp" class="input-field" placeholder="Demo OTP: 1234">
          <button class="btn-small" onclick="verifyMobileOTP()">Verify</button>
        </div>
        <div class="badge-verified" id="badgeMobileVerified">✅ Mobile Verified!</div>
      </div>

      <div class="form-group">
        <label>Email ID (Optional)</label>
        <div class="otp-inline">
          <input type="email" id="regEmail" class="input-field" placeholder="naam@gmail.com (Optional)">
          <button class="btn-small" id="btnSendEmailOtp" onclick="sendEmailOTP()">Verify</button>
        </div>
        <div id="emailOtpBox" style="display: none; margin-top: 8px;" class="otp-inline">
          <input type="number" id="regEmailOtp" class="input-field" placeholder="Demo OTP: 5678">
          <button class="btn-small" onclick="verifyEmailOTP()">Verify</button>
        </div>
        <div class="badge-verified" id="badgeEmailVerified">✅ Email Verified!</div>
      </div>

      <div class="form-group">
        <label>Pata (Full Address)</label>
        <input type="text" id="regAddress" class="input-field" placeholder="Ghar/Mohalla, Shahar, Rajye">
      </div>

      <!-- Password / PIN Creation -->
      <div class="form-group" id="passwordSetupBox">
        <label>Password / Security PIN Set Karein</label>
        <input type="password" id="regPassword" class="input-field" placeholder="Aage login ke liye password dalein">
      </div>

      <button class="btn-primary" onclick="handleRegistration()">Account Banayein 🎉</button>
    </div>

    <p class="helper-text" id="footerText">Surakshit & Bharat Ka Bharosemand Platform</p>
  </div>

  <script>
    // YAHAN APNI GOOGLE APPS SCRIPT KI WEB APP URL DALIE:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybV1k1ZomM_Zp31w0w_M9f1lqVqU2w_example/exec";

    let currentRole = "Customer";
    let isMobileVerified = false;
    let isEmailVerified = false;
    let userCityState = "Detecting...";

    // Auto-detect User Location (100% Free IP API)
    fetch('https://ipapi.co/json/')
      .then(res => res.json())
      .then(data => {
        userCityState = (data.city || "") + ", " + (data.region || "") + " (" + (data.country_name || "") + ")";
      })
      .catch(() => { userCityState = "India"; });

    function setRole(role) {
      currentRole = role;
      document.getElementById('btnRoleCustomer').classList.toggle('active', role === 'Customer');
      document.getElementById('btnRoleOwner').classList.toggle('active', role === 'Hall Owner');
      document.getElementById('portalSubtitle').innerText = role + " Experience Portal";
    }

    function switchTab(tab) {
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('loginFormSection').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerFormSection').style.display = tab === 'register' ? 'block' : 'none';
    }

    // OTP Handlers (Mobile)
    function sendMobileOTP() {
      const mob = document.getElementById('regMobile').value.trim();
      if (mob.length !== 10) return alert("Kripya sahi 10-digit mobile number dalein!");
      document.getElementById('mobileOtpBox').style.display = 'flex';
      alert("Mobile OTP bhej diya gaya hai! (Demo OTP: 1234)");
    }
    function verifyMobileOTP() {
      const otp = document.getElementById('regMobileOtp').value.trim();
      if (otp === "1234") {
        isMobileVerified = true;
        document.getElementById('mobileOtpBox').style.display = 'none';
        document.getElementById('btnSendMobileOtp').style.display = 'none';
        document.getElementById('badgeMobileVerified').style.display = 'flex';
        document.getElementById('regMobile').readOnly = true;
      } else {
        alert("Galat Mobile OTP!");
      }
    }

    // OTP Handlers (Email - Optional)
    function sendEmailOTP() {
      const em = document.getElementById('regEmail').value.trim();
      if (!em || !em.includes('@')) return alert("Kripya sahi email address dalein!");
      document.getElementById('emailOtpBox').style.display = 'flex';
      alert("Email OTP bhej diya gaya hai! (Demo OTP: 5678)");
    }
    function verifyEmailOTP() {
      const otp = document.getElementById('regEmailOtp').value.trim();
      if (otp === "5678") {
        isEmailVerified = true;
        document.getElementById('emailOtpBox').style.display = 'none';
        document.getElementById('btnSendEmailOtp').style.display = 'none';
        document.getElementById('badgeEmailVerified').style.display = 'flex';
        document.getElementById('regEmail').readOnly = true;
      } else {
        alert("Galat Email OTP!");
      }
    }

    // Register Submission
    function handleRegistration() {
      const name = document.getElementById('regName').value.trim();
      const dob = document.getElementById('regDob').value;
      const gender = document.getElementById('regGender').value;
      const mobile = document.getElementById('regMobile').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const address = document.getElementById('regAddress').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!name || !dob || !gender || !mobile || !address || !password) {
        return alert("Kripya saare zaroori fields (Naam, DOB, Gender, Mobile, Pata, Password) bharein!");
      }
      if (!isMobileVerified) {
        return alert("Pehle Mobile Number ko OTP se verify karein!");
      }
      if (email && !isEmailVerified) {
        return alert("Aapne email daala hai, toh kripya use verify karein ya khali chhod dein!");
      }

      const params = new URLSearchParams({
        action: 'register',
        role: currentRole,
        name: name,
        dob: dob,
        gender: gender,
        phone: mobile,
        email: email || "N/A",
        address: address,
        password: password,
        location: userCityState
      });

      // Google Sheet Backend call
      fetch(SCRIPT_URL + "?" + params.toString())
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            alert(res.message);
            // Switch back to Login tab and fill mobile
            switchTab('login');
            document.getElementById('loginMobile').value = mobile;
          } else {
            alert(res.message || "Registration fail hua.");
          }
        })
        .catch(err => {
          // Offline / Demo fallback
          alert("Account successfully ban gaya! (Offline Mode)\nAb aap Login kar sakte hain.");
          switchTab('login');
          document.getElementById('loginMobile').value = mobile;
        });
    }

    // Login Submission (No OTP needed! Just Mobile + Password)
    function handleLogin() {
      const mobile = document.getElementById('loginMobile').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!mobile || !password) {
        return alert("Kripya Mobile Number aur Password dono dalein!");
      }

      const params = new URLSearchParams({
        action: 'login',
        role: currentRole,
        phone: mobile,
        password: password
      });

      fetch(SCRIPT_URL + "?" + params.toString())
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            alert("Swagatam " + res.name + "! Login Safal Raha.");
            redirectToDashboard(currentRole, res.name);
          } else {
            alert(res.message || "Invalid Details!");
          }
        })
        .catch(err => {
          // Demo fallback check
          alert("Demo Login Successful as " + currentRole + "!");
          redirectToDashboard(currentRole, "User");
        });
    }

    function redirectToDashboard(role, name) {
      if (role === 'Hall Owner') {
        window.location.href = "owner-dashboard.html?user=" + encodeURIComponent(name);
      } else {
        window.location.href = "customer-dashboard.html?user=" + encodeURIComponent(name);
      }
    }

    function handleBiometric() {
      if (window.PublicKeyCredential) {
        alert("Biometric device scan active... Aapka Fingerprint verify hua!");
        alert("Swagatam! Biometric se Login Safal.");
        redirectToDashboard(currentRole, "Verified User");
      } else {
        alert("Aapke device mein biometric sensor support nahi mila. Kripya Password se login karein.");
      }
    }
  </script>
</body>
</html>
