<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HallWala Business | Vendor Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Premium Dark Business Background */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Hi-Tech Glassmorphism Panel for Business */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            border-color: #10b981; /* Emerald Green for Business Success */
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            outline: none;
        }

        /* Business Login Button */
        .btn-business {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
        }
        .btn-business:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="p-4 relative overflow-hidden">

    <!-- Background Futuristic Glow -->
    <div class="absolute top-[-10%] left-[-10%] w-72 h-72 bg-emerald-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-72 h-72 bg-indigo-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>

    <!-- Login Container -->
    <div class="glass-panel w-full max-w-md rounded-3xl p-8 relative z-10">
        
        <!-- Header / Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-white/5 rounded-2xl mb-4 border border-white/10">
                <span class="text-3xl">🏢</span>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight mb-1">
                HallWala <span class="text-emerald-400">Business</span>
            </h1>
            <p class="text-slate-400 text-sm font-medium">Manage your venues & grow revenue.</p>
        </div>

        <!-- Login Form -->
        <form onsubmit="event.preventDefault(); handleBusinessLogin();" class="space-y-5">
            
            <!-- Mobile Number -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Registered Mobile Number</label>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-400">🇮🇳 +91</span>
                    <input type="tel" id="vendorMobile" placeholder="Enter 10-digit number" required pattern="[0-9]{10}" class="input-field w-full rounded-xl py-3.5 pl-16 pr-4 text-sm font-medium">
                </div>
            </div>

            <!-- Secure PIN -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Secure Vendor PIN</label>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-400">🔒</span>
                    <input type="password" id="vendorPin" placeholder="Enter 4 or 6 digit PIN" required class="input-field w-full rounded-xl py-3.5 pl-12 pr-4 text-sm font-medium">
                </div>
                <div class="flex justify-end mt-2">
                    <a href="#" class="text-xs font-semibold text-emerald-400 hover:text-emerald-300">Forgot PIN?</a>
                </div>
            </div>

            <!-- Login Button -->
            <button type="submit" onclick="triggerHaptic('heavy')" id="loginBtn" class="btn-business w-full text-white font-bold rounded-xl py-4 mt-4 flex justify-center items-center gap-2">
                Secure Login <span class="text-lg">→</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-6 opacity-40">
            <div class="flex-1 h-px bg-white"></div>
            <span class="text-xs font-semibold">OR</span>
            <div class="flex-1 h-px bg-white"></div>
        </div>

        <!-- Partner Signup Link -->
        <div class="text-center">
            <p class="text-sm text-slate-400">Want to list your hall on HallWala?</p>
            <button onclick="triggerHaptic('light')" class="mt-2 w-full py-3.5 rounded-xl border border-white/20 font-semibold text-white bg-white/5 hover:bg-white/10 transition">
                🚀 Become a Partner
            </button>
        </div>
    </div>

    <!-- Haptic & Logic Script -->
    <script>
        function triggerHaptic(type = 'light') {
            if (navigator.vibrate) {
                if (type === 'light') navigator.vibrate(40);
                if (type === 'heavy') navigator.vibrate([100, 50, 100]);
            }
        }

        function handleBusinessLogin() {
            let btn = document.getElementById('loginBtn');
            // Show Loading State
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Authenticating...`;
            
            // Demo Logic (Replace with real logic later)
            setTimeout(() => {
                triggerHaptic('heavy');
                btn.innerHTML = `Login Successful ✅`;
                btn.style.background = "#059669";
                
                // Redirect to Vendor Dashboard
                setTimeout(() => {
                    alert("Welcome to HallWala Business Dashboard!");
                    // window.location.href = 'vendor_dashboard.html';
                }, 500);
            }, 2000);
        }
    </script>
</body>
</html>
