<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HallWala Business | Vendor Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-field {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #10b981; 
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            outline: none;
        }
        .btn-business {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
        }
        .btn-business:active { transform: scale(0.96); }
    </style>
</head>
<body class="p-4 relative overflow-hidden">

    <!-- Background Glow -->
    <div class="absolute top-[-10%] left-[-10%] w-72 h-72 bg-emerald-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-72 h-72 bg-indigo-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>

    <div class="glass-panel w-full max-w-md rounded-3xl p-8 relative z-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-white/5 rounded-2xl mb-4 border border-white/10">
                <span class="text-3xl">🏢</span>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight mb-1">
                HallWala <span class="text-emerald-400">Business</span>
            </h1>
            <p id="subHeaderText" class="text-slate-400 text-sm font-medium">Manage your venues & grow revenue.</p>
        </div>

        <!-- 1. LOGIN SECTION -->
        <div id="loginSection">
            <form onsubmit="event.preventDefault(); handleBusinessLogin();" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Registered Mobile Number</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3.5 text-slate-400">🇮🇳 +91</span>
                        <input type="tel" placeholder="Enter 10-digit number" required pattern="[0-9]{10}" class="input-field w-full rounded-xl py-3.5 pl-16 pr-4 text-sm font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Secure Vendor PIN</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3.5 text-slate-400">🔒</span>
                        <input type="password" placeholder="Enter 4 or 6 digit PIN" required class="input-field w-full rounded-xl py-3.5 pl-12 pr-4 text-sm font-medium">
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="btn-business w-full text-white font-bold rounded-xl py-4 mt-4 flex justify-center items-center gap-2">
                    Secure Login <span class="text-lg">→</span>
                </button>
            </form>

            <div class="flex items-center gap-4 my-6 opacity-40">
                <div class="flex-1 h-px bg-white"></div>
                <span class="text-xs font-semibold">OR</span>
                <div class="flex-1 h-px bg-white"></div>
            </div>

            <div class="text-center">
                <p class="text-sm text-slate-400">Want to list your hall on HallWala?</p>
                <button onclick="toggleSection('register')" class="mt-2 w-full py-3.5 rounded-xl border border-white/20 font-semibold text-white bg-white/5 hover:bg-white/10 transition">
                    🚀 Become a Partner
                </button>
            </div>
        </div>

        <!-- 2. REGISTRATION SECTION (Hidden By Default) -->
        <div id="registerSection" style="display: none;">
            <form onsubmit="event.preventDefault(); handleBusinessRegister();" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Owner Full Name</label>
                    <input type="text" placeholder="Enter your name" required class="input-field w-full rounded-xl py-3 px-4 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Hall / Banquet Name</label>
                    <input type="text" placeholder="e.g. Royal Palace" required class="input-field w-full rounded-xl py-3 px-4 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Mobile Number</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3 text-slate-400">🇮🇳 +91</span>
                        <input type="tel" placeholder="10-digit number" required pattern="[0-9]{10}" class="input-field w-full rounded-xl py-3 pl-16 pr-4 text-sm font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Create 4-Digit PIN</label>
                    <input type="password" placeholder="Create a secure PIN" required class="input-field w-full rounded-xl py-3 px-4 text-sm font-medium">
                </div>
                
                <button type="submit" id="registerBtn" class="btn-business w-full text-white font-bold rounded-xl py-4 mt-4 flex justify-center items-center gap-2">
                    Register My Hall ✅
                </button>
            </form>
            
            <div class="text-center mt-5">
                <button onclick="toggleSection('login')" class="text-sm font-semibold text-emerald-400 hover:text-emerald-300">
                    ← Back to Login
                </button>
            </div>
        </div>

    </div>

    <!-- Haptic & Dummy Logic Script -->
    <script>
        function triggerHaptic(type = 'light') {
            if (navigator.vibrate) {
                if (type === 'light') navigator.vibrate(40);
                if (type === 'heavy') navigator.vibrate([100, 50, 100]);
            }
        }

        function toggleSection(section) {
            triggerHaptic('light');
            const loginSec = document.getElementById('loginSection');
            const regSec = document.getElementById('registerSection');
            const subText = document.getElementById('subHeaderText');
            
            if (section === 'register') {
                loginSec.style.display = 'none';
                regSec.style.display = 'block';
                subText.innerText = 'Register your hall and get more bookings.';
            } else {
                regSec.style.display = 'none';
                loginSec.style.display = 'block';
                subText.innerText = 'Manage your venues & grow revenue.';
            }
        }

        // Dummy Login Logic (Redirects to Owner Dashboard)
        function handleBusinessLogin() {
            triggerHaptic('heavy');
            let btn = document.getElementById('loginBtn');
            btn.innerHTML = `Authenticating...`;
            
            setTimeout(() => {
                btn.innerHTML = `Login Successful ✅`;
                btn.style.background = "#059669";
                
                setTimeout(() => {
                    // Yahan `../` lagaya hai kyunki ye partner folder ke andar hai
                    window.location.href = '../owner-dashboard.html'; 
                }, 500);
            }, 1500);
        }

        // Dummy Registration Logic
        function handleBusinessRegister() {
            triggerHaptic('heavy');
            let btn = document.getElementById('registerBtn');
            btn.innerHTML = `Registering...`;
            
            setTimeout(() => {
                btn.innerHTML = `Registration Successful! 🎉`;
                btn.style.background = "#059669";
                
                setTimeout(() => {
                    alert("Account created successfully! Please login with your details.");
                    toggleSection('login');
                    btn.innerHTML = `Register My Hall ✅`;
                    btn.style.background = ""; // Reset Button Color
                }, 1000);
            }, 1500);
        }
    </script>
</body>
</html>
