<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HallWala - Customer Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --accent: #f43f5e;
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --card: #ffffff;
      --danger: #ef4444;
      --success: #16a34a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }

    /* Top Header */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #4f46e5, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; background: white;
      border-top: 1px solid var(--border); display: flex; justify-content: space-around;
      padding: 12px 0; z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
    }
    .nav-item { text-align: center; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 12px; flex: 1; transition: 0.2s;}
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 22px; margin-bottom: 4px; display: block; }

    /* Screens */
    .screen { display: none; }
    .screen.active { display: block; }

    /* Filter Area */
    .filter-section {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      color: white;
      padding: 24px 16px;
    }
    .filter-section h2 { font-size: 20px; margin-bottom: 16px; text-align: center; font-weight: 800; }
    .filter-bar {
      max-width: 950px; margin: 0 auto; display: grid;
      grid-template-columns: 1.2fr 1.2fr 1.6fr; gap: 10px;
      background: white; padding: 10px; border-radius: 14px;
    }
    @media(max-width: 768px) { .filter-bar { grid-template-columns: 1fr; } }
    .filter-control {
      padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 14px; outline: none;
      color: var(--text); font-weight: 600; background: white;
    }

    .main-wrap { max-width: 1150px; margin: 20px auto; padding: 0 16px; }
    .results-count { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 16px; }

    /* Hall Cards */
    .hall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .hall-card { background: white; border-radius: 18px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .media-thumb { height: 200px; background-size: cover; background-position: center; position: relative; cursor: pointer; }
    .media-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(15, 23, 42, 0.85); color: white; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .tap-hint { position: absolute; top: 10px; left: 10px; background: rgba(79, 70, 229, 0.9); color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    
    .h-info { padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .h-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .h-loc { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .tag { background: #f1f5f9; color: #475569; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    
    .action-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; }
    .rent-price { font-size: 18px; font-weight: 800; color: var(--text); }
    .btn-offer { background: var(--accent); color: white; border: none; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }

    /* Account & Bookings Screens */
    .acc-header { text-align: center; padding: 20px 0; }
    .acc-avatar { width: 80px; height: 80px; background: #e0e7ff; border-radius: 50%; margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .acc-box { background: white; border-radius: 16px; border: 1px solid var(--border); padding: 20px; max-width: 500px; margin: 0 auto; }
    .acc-group { margin-bottom: 16px; }
    .acc-group label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .acc-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; font-weight: 600; background: #f8fafc; outline: none; }
    .btn-save { width: 100%; background: var(--primary); color: white; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 16px; margin-top: 10px; cursor: pointer; }
    .btn-logout { width: 100%; background: #fee2e2; color: #ef4444; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 16px; margin-top: 16px; cursor: pointer; }

    /* Modals (Gallery & Calendar) */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(5px); z-index: 1000; overflow-y: auto; padding: 20px 10px; }
    .modal-box { max-width: 600px; background: white; margin: 20px auto; border-radius: 20px; padding: 22px; position: relative; }
    .modal-close { position: absolute; top: 14px; right: 14px; background: #f1f5f9; border: none; font-size: 18px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: 700; }

    .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .gallery-item { height: 140px; border-radius: 10px; background-size: cover; background-position: center; position: relative; }
    .gallery-label { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; font-size: 10px; border-radius: 4px; font-weight: 600; }
    .video-preview-box { background: #0f172a; color: white; border-radius: 12px; padding: 20px; text-align: center; margin-top: 10px; }

    /* Real Calendar Layout */
    .cal-wrapper { border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin: 18px 0; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: 800; font-size: 16px; }
    .cal-btn { background: #e0e7ff; color: var(--primary); border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 800; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 8px; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day { padding: 12px 0; text-align: center; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 2px;}
    .day.empty { visibility: hidden; }
    .day.past { color: #cbd5e1; cursor: not-allowed; background: #f8fafc; }
    .day.available { background: #ecfdf5; color: var(--success); border-color: #a7f3d0; }
    .day.booked { background: #fee2e2; color: var(--danger); text-decoration: line-through; cursor: not-allowed; border-color: #fca5a5; }
    .day.selected { background: var(--primary) !important; color: white !important; transform: scale(1.05); }

    .input-offer { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 18px; font-weight: 800; margin: 8px 0 12px 0; text-align: center; }
    .btn-submit-offer { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; }
  </style>
</head>

    function initStates() {
      const stateSelect = document.getElementById('stateSelect');
      stateSelect.innerHTML = `<option value="All">All States & Union Territories</option>`;

      const sortedStates = Object.keys(indiaData).sort();
      sortedStates.forEach(st => {
        const opt = document.createElement('option');
        opt.value = st;
        opt.innerText = st;
        if (st === "Jharkhand") opt.selected = true;
        stateSelect.appendChild(opt);
      });

      onStateChange();
    }

    function onStateChange() {
      const selectedState = document.getElementById('stateSelect').value;
      const districtSelect = document.getElementById('districtSelect');
      districtSelect.innerHTML = `<option value="All">All Cities & Districts</option>`;

      if (selectedState !== "All" && indiaData[selectedState]) {
        const sortedDistricts = [...indiaData[selectedState]].sort();
        sortedDistricts.forEach(dist => {
          const opt = document.createElement('option');
          opt.value = dist;
          opt.innerText = dist;
          districtSelect.appendChild(opt);
        });
      }
      applyFilters();
    }

    function renderHalls(list) {
      const cont = document.getElementById('hallsContainer');
      cont.innerHTML = "";
      document.getElementById('resultsCount').innerText = "Showing " + list.length + " Halls";

      if (list.length === 0) {
        cont.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; background: white; border-radius: 14px; color: var(--muted);">
          <h3>No halls available in this city yet!</h3>
          <p style="font-size: 13px; margin-top: 6px;">New hall owners are joining soon across India.</p>
        </div>`;
        return;
      }

      list.forEach(h => {
        cont.innerHTML += `
          <div class="hall-card">
            <div class="media-thumb" style="background-image: url('${h.img}')" onclick="openGallery('${h.name}')">
              <span class="tap-hint">Tap Photo to view Rooms & Video 🎥</span>
              <span class="media-badge">📸 4 Photos | 🎥 1 Video</span>
            </div>
            <div class="h-info">
              <div>
                <div class="h-title">${h.name}</div>
                <div class="h-loc">📍 ${h.locality}, ${h.district} | Capacity: ${h.capacity}</div>
                <div class="tags">${h.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
              </div>
              <div class="action-row">
                <div>
                  <div style="font-size:11px; color:var(--muted);">Base Rent</div>
                  <div class="rent-price">₹${h.rent.toLocaleString('en-IN')}</div>
                </div>
                <button class="btn-offer" onclick="openOfferModal(${h.id})">Check Dates & Offer</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function applyFilters() {
      const state = document.getElementById('stateSelect').value;
      const dist = document.getElementById('districtSelect').value;
      const search = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = allHalls.filter(h => {
        const matchState = (state === "All") || (h.state === state);
        const matchDist = (dist === "All") || (h.district.toLowerCase() === dist.toLowerCase());
        const matchSearch = h.name.toLowerCase().includes(search) || h.locality.toLowerCase().includes(search) || h.district.toLowerCase().includes(search);
        return matchState && matchDist && matchSearch;
      });
      renderHalls(filtered);
    }

    // MODALS LOGIC
    function openGallery(name) {
      document.getElementById('galleryTitle').innerText = name + " - Photos & Video Tour";
      document.getElementById('galleryModal').style.display = 'block';
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // --- REAL CALENDAR & OFFER LOGIC ---
    let nav = 0;
    let currentHall = null;
    let chosenFullDate = null;
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const dbBookedDates = ["15-11-2026", "20-11-2026", "05-12-2026"]; 

    function openOfferModal(hallId) {
      currentHall = allHalls.find(h => h.id === hallId);
      document.getElementById('offerHallName').innerText = currentHall.name;
      document.getElementById('offerHallMeta').innerText = "📍 " + currentHall.locality + ", " + currentHall.district + " | Official Base Rent: ₹" + currentHall.rent.toLocaleString('en-IN');
      
      const priceBox = document.getElementById('offerPriceBox');
      priceBox.value = "";
      priceBox.max = currentHall.rent;

      chosenFullDate = null;
      document.getElementById('pickedDateLabel').innerText = "Please select a date";
      
      nav = 0; 
      loadCalendar();
      document.getElementById('offerModal').style.display = 'block';
    }

    function changeMonth(dir) {
      nav += dir;
      loadCalendar();
    }

    function loadCalendar() {
      const dt = new Date(); 
      if (nav !== 0) { dt.setMonth(new Date().getMonth() + nav); }
      
      const month = dt.getMonth();
      const year = dt.getFullYear();

      const firstDayOfMonth = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const dateString = firstDayOfMonth.toLocaleDateString('en-us', { weekday: 'short', year: 'numeric', month: 'numeric', day: 'numeric' });
      const paddingDays = weekdays.indexOf(dateString.split(', ')[0]);

      document.getElementById('monthYearDisplay').innerText = `${months[month]} ${year}`;
      const calendarDays = document.getElementById('calendarDays');
      calendarDays.innerHTML = '';

      const todayReal = new Date();
      todayReal.setHours(0,0,0,0);

      for (let i = 1; i <= paddingDays + daysInMonth; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');

        if (i > paddingDays) {
          const dayNum = i - paddingDays;
          const thisDateObj = new Date(year, month, dayNum);
          const formattedDate = `${String(dayNum).padStart(2, '0')}-${String(month+1).padStart(2, '0')}-${year}`;

          if (thisDateObj < todayReal) {
            dayDiv.classList.add('past');
            dayDiv.innerHTML = `<span>${dayNum}</span><span style="font-size:9px;">⚪</span>`;
          } 
          else if (dbBookedDates.includes(formattedDate)) {
            dayDiv.classList.add('booked');
            dayDiv.innerHTML = `<span>${dayNum}</span><span style="font-size:10px;">❌</span>`;
            dayDiv.onclick = () => alert("This date is already Booked by another customer!");
          } 
          else {
            dayDiv.classList.add('available');
            dayDiv.innerHTML = `<span>${dayNum}</span><span style="font-size:9px;">🟢</span>`;
            if (chosenFullDate === formattedDate) { dayDiv.classList.add('selected'); }
            
            dayDiv.onclick = () => {
              chosenFullDate = formattedDate;
              document.getElementById('pickedDateLabel').innerText = `${dayNum} ${months[month]} ${year}`;
              loadCalendar();
            };
          }
        } else {
          dayDiv.classList.add('empty');
        }
        calendarDays.appendChild(dayDiv);
      }
    }

    function submitValidOffer() {
      const enteredPrice = Number(document.getElementById('offerPriceBox').value);

      if (!chosenFullDate) return alert("Please select an available green date from the calendar first!");
      if (!enteredPrice || enteredPrice <= 0) return alert("Please enter a valid offer amount (₹)!");
      if (enteredPrice > currentHall.rent) return alert("❌ Invalid Offer!\nThe base rent is ₹" + currentHall.rent.toLocaleString('en-IN') + ". Your offer cannot exceed the base rent!");
      if (String(enteredPrice).length >= 10) return alert("Phone numbers are not allowed! Please enter an offer amount.");

      alert(`🎉 Offer Sent Successfully!\n\nHall: ${currentHall.name}\nDate: ${chosenFullDate}\nYour Offer: ₹${enteredPrice.toLocaleString('en-IN')}\n\nNext Step: Hall Owner will review this. Once accepted, you will pay the Token Amount here to automatically generate the legal PDF agreement via Email/WhatsApp.`);
      closeModal('offerModal');
    }

    // Launch App
    initStates();
